<style>

/* 시연 조작 바 */
.demobar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:200;background:#1C2547;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:12.5px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}

.appsw{display:flex;align-items:center;gap:7px;flex-shrink:0}

.sw::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}

/* 상단 바 */
nav.top{position:fixed;top:var(--bar-h);left:0;right:0;z-index:100;height:var(--top-h);display:flex;align-items:center;gap:20px;padding:0 28px 0 18px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(26,33,56,.04)}
.menu-btn{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--bs);background:rgba(26,33,56,.05);font-size:18px;color:var(--txt);flex-shrink:0;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer;width:calc(var(--side-w) - 18px);text-decoration:none;color:var(--txt)}

.page{padding-top:calc(var(--bar-h) + var(--top-h))}

.ad-side{position:fixed;top:calc(var(--bar-h) + var(--top-h));left:0;bottom:0;width:var(--side-w);z-index:90;background:rgba(255,255,255,.98);border-right:1px solid var(--bs);display:flex;flex-direction:column}

.ad-side-foot{padding:10px 14px;border-top:1px solid var(--bs);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ad-side-foot .role{padding:2px 8px;border-radius:10px;background:rgba(245,197,24,.16);color:var(--pri);font-weight:600}

.ad-main{margin-left:var(--side-w);padding:26px 32px 140px;min-height:calc(100vh - var(--bar-h) - var(--top-h))}

.ad-crumb{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.tb{font-size:10px;font-weight:700;padding:0 6px;border-radius:10px;border:1px solid;white-space:nowrap;background:#fff;line-height:16px}
/* 공통 화면 */
h2{font-size:24px;font-weight:700;letter-spacing:-.3px;line-height:1.35;margin-bottom:4px}
.desc{font-size:13px;color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bs);border-radius:14px;padding:24px 26px;margin-bottom:18px}
.card h3{font-size:15px;font-weight:600;color:var(--pri);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--bs)}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{display:block;font-size:26px;font-weight:700;color:var(--pri);line-height:1.25;margin-top:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;font-size:11px;color:var(--muted);font-weight:600;background:rgba(26,33,56,.03);border-bottom:1px solid var(--bs);white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(26,33,56,.05);vertical-align:middle}
tr:hover td{background:rgba(245,197,24,.04)}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:var(--gold);color:var(--on-gold);transition:all .2s;white-space:nowrap}
.btn:hover{background:var(--gold-dim)}
.btn.sm{padding:6px 13px;font-size:12px}
.btn.acc{background:var(--pri);color:#fff}.btn.acc:hover{background:var(--pri-soft)}
.btn.line{background:rgba(26,33,56,.06);color:var(--txt);border:1px solid var(--bs)}.btn.line:hover{background:rgba(26,33,56,.11)}
.btn.ok{background:rgba(46,158,91,.14);color:#1E7A44;border:1px solid rgba(46,158,91,.3)}
.btn.bad{background:rgba(214,69,69,.14);color:var(--bad);border:1px solid rgba(214,69,69,.3)}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:10px;background:rgba(26,33,56,.06);color:var(--muted);font-weight:600;white-space:nowrap;line-height:1.6}
.pill.ok{background:rgba(46,158,91,.12);color:#1E7A44}.pill.bad{background:rgba(214,69,69,.12);color:var(--bad)}.pill.warn{background:rgba(245,197,24,.22);color:#7A5E00}.pill.blue{background:rgba(36,64,142,.1);color:var(--pri)}
.hint{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.45);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:18px;display:flex;gap:10px;line-height:1.65}

.warnbox{background:rgba(214,69,69,.07);border:1px solid rgba(214,69,69,.25);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:10px 0}
.lock{max-width:480px;margin:50px auto;text-align:center;background:#fff;border:1px solid var(--bs);border-radius:16px;padding:40px 30px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(26,33,56,.03);border:1px solid var(--bs);margin-bottom:8px;font-size:13px}

.topstrip{display:flex;align-items:center;justify-content:center;height:40px;background:var(--gold);color:var(--on-gold);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.hero{min-height:calc(100vh - 148px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 24px 50px;position:relative;overflow:hidden}
.hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 50% at 50% 30%,rgba(74,102,184,.14) 0%,transparent 65%),radial-gradient(ellipse 30% 25% at 75% 70%,rgba(245,197,24,.16) 0%,transparent 60%)}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid var(--border);border-radius:100px;font-size:12px;color:var(--pri);letter-spacing:1.5px;margin-bottom:30px;position:relative}

.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:1100px;margin:0 auto;position:relative}
.menu-card{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--bs);border-radius:16px;padding:30px 26px 26px;transition:border-color .25s,transform .2s;position:relative;overflow:hidden;cursor:pointer}

.band{background:var(--bg2)}

footer.sf{padding:40px 48px;border-top:1px solid var(--bs);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}

/* 모달·알림 */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.md{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:26px;position:relative;box-shadow:0 20px 60px rgba(26,33,56,.18)}

.md h3{font-size:17px;font-weight:700;margin-bottom:12px}

/* 단계 안내 */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pc{background:#fff;border:1.5px solid var(--bs);border-radius:16px;padding:24px;display:flex;flex-direction:column}
.pc.cur{box-shadow:0 8px 28px rgba(36,64,142,.12)}
.pc .pn{font-weight:700;font-size:20px}
.pc .ps{font-size:13px;color:var(--muted);margin-top:2px}
.pc ul{padding-left:18px;margin:14px 0 18px;font-size:13px;line-height:1.85;flex:1}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:800}.no{color:#C9CDDA}
.qr{display:grid;grid-template-columns:repeat(25,1fr);width:180px;height:180px;border:10px solid #fff;outline:1px solid var(--bs);background:#fff}
.qr i.k{background:#111}
.vb{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.vb div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.vb div i{display:block;width:100%;max-width:42px;background:rgba(36,64,142,.75);border-radius:6px 6px 0 0}
.vb div.t i{background:var(--gold)}
/* 반응형 */
@media(max-width:1023px){
  :root{--top-h:56px}
  body.has-side .menu-btn{display:inline-flex}
  .brand{width:auto}
  .ad-side{transform:translateX(-100%);transition:transform .22s ease;width:min(300px,86vw);box-shadow:0 0 40px rgba(26,33,56,.15)}
  body.side-open .ad-side{transform:none}
  body.side-open .ad-backdrop{display:block}
  body.side-open{overflow:hidden}
  .ad-main{margin-left:0;padding:18px 16px 150px}
  .nav-links{gap:18px}
  .nav-who{display:none}
  .card-grid{grid-template-columns:repeat(2,1fr);max-width:760px}
}
@media(max-width:768px){
  nav.top{padding:0 12px;gap:12px}
  .logo-text{display:none}
  h2{font-size:21px}
  .card{padding:18px}
  .hero-title{letter-spacing:-1.5px}
  .card-grid{grid-template-columns:1fr;max-width:420px}
  .sec{padding:56px 20px}
  footer.sf{padding:32px 20px}
  #phone{width:240px;right:10px;bottom:10px}
  #toast{right:12px;left:12px;align-items:stretch}
  .wk{grid-template-columns:repeat(2,1fr);min-width:0!important}
  .demobar .lb{display:none}
  br.dbr{display:none}
}
/* ===== 홈페이지 시안 A·B·C ===== */
.hp{background:var(--hp-paper);color:var(--hp-ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
.hp.vA{--hp-paper:#f2f4f2;--hp-ink:#1c1d1f;--hp-muted:#6d6e72;--hp-line:#d9dfdb;--hp-acc:#6fd3a8;--hp-acc-ink:#0d2219;--hp-night:#1f2d27;--hp-strong:#1d7f5a;--hp-soft:#e4f4ec;--hp-display:'IBM Plex Sans KR','Noto Sans KR',sans-serif;--hp-r:0px}
.hp.vB{--hp-paper:#ffffff;--hp-ink:#1a2547;--hp-muted:#5c6683;--hp-line:#e1e6f0;--hp-acc:#ff6a3d;--hp-acc-ink:#fff;--hp-night:#1a2547;--hp-strong:#e0501f;--hp-soft:#f5f7fc;--hp-display:'Gothic A1','Noto Sans KR',sans-serif;--hp-r:18px}
.hp.vC{--hp-paper:#f6f5f2;--hp-ink:#121212;--hp-muted:#6a6864;--hp-line:#e0ddd6;--hp-acc:#e03a26;--hp-acc-ink:#fff;--hp-night:#121212;--hp-strong:#c42f1c;--hp-soft:#efede8;--hp-display:'Black Han Sans','Noto Sans KR',sans-serif;--hp-r:0px;padding-left:250px}
.hp button{font-family:inherit;color:inherit}
.hp-wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hp.vC .hp-wrap{max-width:1180px;padding:0 28px 0 44px;margin:0}
.hp-hint{padding-top:14px}.hp-hint .hint{margin-bottom:14px}
.hp-head{position:sticky;top:var(--bar-h);z-index:60;background:var(--hp-paper);border-bottom:1px solid var(--hp-line)}
.hp.vB .hp-head{background:rgba(255,255,255,.96)}
.hp-bar{display:flex;align-items:center;gap:28px;height:68px}
.hp-logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.hp-mark{width:34px;height:34px;border-radius:8px;background:var(--hp-acc);color:var(--hp-acc-ink);display:grid;place-items:center;font-family:var(--hp-display);font-weight:700;font-size:16px;position:relative}
.hp.vB .hp-mark{background:var(--hp-night);color:#fff}
.hp.vB .hp-mark::after{content:'';position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--hp-acc);border:2px solid #fff}
.hp-logo b{font-family:var(--hp-display);font-weight:700;font-size:20px;letter-spacing:-.5px}
.hp-nav{display:flex;gap:30px;margin-left:auto}
.hp.vB .hp-nav{margin-left:28px;gap:30px}
.hp-nav button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;font-weight:700;font-size:15px}
.hp.vB .hp-nav button{color:var(--hp-muted);font-weight:600}
.hp-nav button:hover{border-color:var(--hp-acc);color:var(--hp-ink)}
.hp-login{background:var(--hp-night);color:#fff!important;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px}
.hp.vB .hp-login{margin-left:auto}
.hp.vA .hp-login{border-radius:0;background:var(--hp-acc);color:var(--hp-acc-ink)!important}
.hp-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 22px;font-size:15px;font-weight:700;border:1.5px solid var(--hp-acc);background:var(--hp-acc);color:var(--hp-acc-ink)!important;border-radius:var(--hp-r);transition:opacity .2s}
.hp-btn:hover{opacity:.88}
.hp.vB .hp-btn{border-radius:999px;padding:14px 26px;font-size:16px}
.hp-btn.gh{background:transparent;color:var(--hp-ink)!important;border-color:var(--hp-line)}
.hp.vB .hp-btn.gh{background:#fff}
.hp.vC .hp-btn.gh{background:var(--hp-night);color:#fff!important;border-color:var(--hp-night)}
.hp h1{font-family:var(--hp-display);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1.18;letter-spacing:-1.5px;margin:0}
.hp h1 em{font-style:normal;display:block;color:var(--hp-acc)}
.hp .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.chalk{position:absolute;inset:0;pointer-events:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;color:rgba(255,255,255,.09);font-size:38px;white-space:nowrap;overflow:hidden}
.chalk span{position:absolute}
/* A 칠판 */
.hA{position:relative;background:var(--hp-night);color:#fff;overflow:hidden}
.hA::after{content:'';position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(#8a6a45,#6e5233);box-shadow:0 -2px 0 rgba(0,0,0,.25)}
.hA-in{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;padding-top:84px;padding-bottom:100px}
.hA .kick{display:inline-block;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--hp-acc-ink);background:var(--hp-acc);padding:5px 12px;margin-bottom:22px}
.hA h1 em span{background-image:linear-gradient(transparent 82%,rgba(111,211,168,.35) 82%)}
.hA .sub{margin-top:22px;color:rgba(255,255,255,.78);font-size:16px}
.hA .hp-btn.gh{color:#fff!important;border-color:rgba(255,255,255,.45)}
.quick{background:rgba(10,18,15,.62);border:1px solid rgba(255,255,255,.12);min-width:0}
.quick-h{font-size:12px;letter-spacing:2px;color:var(--hp-acc);font-weight:700;padding:18px 22px 8px}
.quick button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(255,255,255,.1);padding:16px 22px;color:#fff}
.quick button:hover{background:rgba(111,211,168,.1)}
.quick b{font-family:var(--hp-display);font-size:18px;font-weight:600}
.quick small{color:rgba(255,255,255,.62);font-size:13px}
.quick .arr{grid-row:1/span 2;grid-column:2;align-self:center;color:var(--hp-acc);font-size:20px}
/* B 모눈 */
.hB{background-color:#fff;background-image:linear-gradient(#e3eaf7 1px,transparent 1px),linear-gradient(90deg,#e3eaf7 1px,transparent 1px);background-size:26px 26px;text-align:center;padding:80px 0 44px}
.hB .tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--hp-ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px}
.hB .tag i{width:8px;height:8px;border-radius:50%;background:var(--hp-acc)}
.hB h1{font-weight:800;font-size:clamp(36px,6.4vw,72px);line-height:1.12;letter-spacing:-2px;margin:24px auto 0}
.hB h1 em span{position:relative}
.hB h1 em span::after{content:'';position:absolute;left:-2%;right:-2%;bottom:.02em;height:.14em;background:var(--hp-ink);border-radius:4px;transform:rotate(-1deg);opacity:.9}
.hB .sub{color:var(--hp-muted);font-size:17px;margin-top:26px}
.hB .cta{justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px;text-align:left}
.tile{background:#fff;border:1.5px solid var(--hp-line);border-radius:18px;padding:22px;display:grid;gap:6px;justify-items:start;align-content:start;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--hp-ink);box-shadow:0 10px 24px rgba(26,37,71,.08)}
.tile svg{width:34px;height:34px;stroke:var(--hp-acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.tile b{font-family:var(--hp-display);font-size:18px;font-weight:800}
.tile small{color:var(--hp-muted);font-size:13px;line-height:1.5}
/* C 세로 메뉴 */
.cside{position:fixed;left:0;top:var(--bar-h);bottom:0;width:250px;background:#121212;color:#fff;padding:30px 22px 22px;display:flex;flex-direction:column;z-index:60}
.cside .bar{width:36px;height:5px;background:var(--hp-acc);margin-bottom:16px}
.cside .nm{font-family:var(--hp-display);font-size:25px;white-space:nowrap;line-height:1.15;background:none;border:0;color:#fff!important;text-align:left;padding:0}
.cside .en{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.55);margin-top:6px}
.cside .nv{display:grid;gap:2px;margin-top:44px}
.cside .nv button{background:none;border:0;color:rgba(255,255,255,.8)!important;font-weight:700;font-size:16px;text-align:left;padding:10px}
.cside .nv button:hover{color:#fff!important}
.cside .ft{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding-top:18px;font-size:13px;color:rgba(255,255,255,.6);line-height:1.9}
.cside .ft b{color:#fff;font-size:15px}
.cside .ft .hp-btn{width:100%;margin-top:12px;padding:10px;font-size:14px}
.hC{display:grid;grid-template-columns:1.15fr .85fr;min-height:520px;border-bottom:2px solid var(--hp-ink)}
.hC .tx{padding:60px 40px 48px 0;display:flex;flex-direction:column;min-width:0}
.hC .k{font-weight:700;color:var(--hp-acc);font-size:15px;letter-spacing:1px}
.hC h1{font-weight:400;font-size:clamp(40px,4.6vw,66px);line-height:1.06;letter-spacing:-2px;margin-top:20px}
.hC .sub{font-size:17px;color:var(--hp-muted);margin-top:26px}
.hC .cta{margin-top:auto;padding-top:34px;gap:0}
.hC .im{position:relative;background:linear-gradient(160deg,#4a120c,#240604);overflow:hidden;min-height:320px}
.hC .im .chalk{color:rgba(224,58,38,.5)}
.hC .cap{position:absolute;left:0;bottom:0;background:#121212;color:#fff;padding:16px 20px;font-size:13px}
.hC .cap b{display:block;font-size:15px}
.cidx{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--hp-ink)}
.cidx button{background:none;border:0;border-right:1px solid var(--hp-line);padding:22px 18px 24px;text-align:left;display:grid;gap:6px;min-width:0}
.cidx button:last-child{border-right:0}
.cidx button:hover{background:#fff}
.cidx b{font-family:var(--hp-display);font-weight:400;font-size:24px}
.cidx small{color:var(--hp-muted);font-size:13px}
.cidx .arr{color:var(--hp-acc);font-weight:700;font-size:13px}
/* 아래 공통 */
.hp-sec{padding:50px 0}
.hp-h2{font-family:var(--hp-display);font-size:24px;font-weight:700;margin:0 0 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;letter-spacing:-.5px}
.hp.vB .hp-h2{font-weight:800;font-size:26px}
.hp.vC .hp-h2{font-weight:400;font-size:30px}
.hp-h2 button{background:none;border:0;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:var(--hp-strong)!important}
.hp-two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.hp-box{background:#fff;border:1.5px solid var(--hp-line);border-radius:var(--hp-r);padding:24px;min-width:0}
.hp-box .hp-h2{font-size:19px}
.hp.vA .hp-box{background:none;border:0;padding:0}
.hp.vA .hp-box .hp-h2{padding-bottom:10px;border-bottom:2px solid var(--hp-ink)}
.hp.vC .hp-box{background:none;border:0;padding:0}
.hp.vC .hp-box .hp-h2{font-size:30px}
.hp.vB .hp-box.dark{background:var(--hp-night);color:#fff;border-color:var(--hp-night)}
.nl button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px dashed var(--hp-line);padding:13px 0;text-align:left;font-size:15px}
.nl button:first-child{border-top:0}
.hp.vC .nl button{border-top-style:solid}
.nl button:hover span{color:var(--hp-strong)}
.nl time{color:var(--hp-muted);font-size:13px;flex-shrink:0}
.tel{font-family:var(--hp-display);font-weight:700;font-size:26px;line-height:1.45;font-variant-numeric:tabular-nums}
.hp.vC .tel{font-weight:400;font-size:32px}
.tel small{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;opacity:.7;margin-right:6px}
.hours{font-size:13px;opacity:.8;margin:6px 0 16px}
.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.course{background:#fff;border:1.5px solid var(--hp-line);border-radius:var(--hp-r);overflow:hidden;text-align:left;padding:0;transition:transform .15s}
.course:hover{transform:translateY(-3px)}
.course .th{height:128px;position:relative;padding:14px 16px;color:#fff;text-align:left}
.course .th .bd{display:inline-block;background:rgba(0,0,0,.55);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700}
.course .th .t{font-weight:700;font-size:14px;margin-top:6px}
.course .th .w{position:absolute;right:14px;bottom:6px;font-family:Georgia,serif;font-style:italic;font-size:28px;opacity:.18}
.course .bd2{padding:14px 16px}
.course .bd2 b{display:block;font-size:15px}
.course .bd2 small{color:var(--hp-muted);font-size:13px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step3{background:var(--hp-soft);border-radius:var(--hp-r);padding:22px}
.hp.vC .step3{background:none;border-top:2px solid var(--hp-ink);padding:18px 0 0}
.step3 .n{font-family:var(--hp-display);font-weight:800;font-size:32px;color:var(--hp-strong);line-height:1.2}
.step3 b{display:block;font-size:16px;margin-top:4px}
.step3 small{color:var(--hp-muted);font-size:13px}
.step3 em{display:block;font-style:normal;font-weight:700;font-size:14px;color:var(--hp-strong);margin:6px 0 4px}
.team{background:var(--hp-night);color:#fff;padding:56px 0 60px}
.team .hp-h2{color:#fff;margin-bottom:6px}
.team .tsub{color:rgba(255,255,255,.7);font-size:14px;margin:0 0 26px}
.team-g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tm{margin:0;background:#fff;border-radius:var(--hp-r);overflow:hidden;color:var(--hp-ink);transition:transform .3s var(--ease-out),box-shadow .3s}
.tm:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.tm img{display:block;width:100%;aspect-ratio:5/6;object-fit:cover;background:#e9e9ec}
.tm figcaption{padding:14px 16px 16px;display:flex;align-items:baseline;gap:8px}
.tm figcaption b{font-family:var(--hp-display);font-size:19px;letter-spacing:-.3px}
.tm figcaption span{font-size:13px;font-weight:700;color:var(--hp-strong)}
@media(max-width:1000px){.team-g{grid-template-columns:repeat(2,1fr);gap:12px}.team{padding:40px 0 44px}.tm figcaption b{font-size:17px}}
.hA .hA-in{grid-template-columns:1fr 1.15fr;padding-top:44px;padding-bottom:28px}
.hteam-h{font-size:12px;letter-spacing:2px;color:var(--hp-acc);font-weight:700;margin-bottom:10px}
.hteam-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hteam .tm img{aspect-ratio:6/5;object-position:50% 14%}
.hteam .tm figcaption{padding:9px 12px 10px}
.hteam .tm figcaption b{font-size:16px}
.qrow-w{position:relative;padding-bottom:40px}
.qrow{display:grid;grid-template-columns:repeat(4,1fr)}
.qrow button{border-top:0;border-left:1px solid rgba(255,255,255,.1)}
.qrow button:first-child{border-left:0}
@media(max-width:900px){
  .hA .hA-in{grid-template-columns:1fr;gap:22px;padding-top:30px;padding-bottom:18px}
  .hA h1{font-size:30px}.hA .sub{margin-top:12px;font-size:14px}.hA .kick{margin-bottom:12px}
  .hteam-g{grid-template-columns:repeat(4,1fr);gap:6px}
  .hteam .tm img{aspect-ratio:3/4;object-position:50% 10%}
  .hteam .tm figcaption{padding:6px 4px 7px;flex-direction:column;align-items:center;gap:0}
  .hteam .tm figcaption b{font-size:13px}.hteam .tm figcaption span{font-size:11px}
  .qrow{grid-template-columns:repeat(2,1fr)}
  .qrow button{border-left:0;border-top:1px solid rgba(255,255,255,.1)}
  .qrow small{display:none}
}
.steps4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.steps4{grid-template-columns:repeat(2,1fr)}}
.hp-form{max-width:640px;background:#fff;border:1.5px solid var(--hp-line);border-radius:var(--hp-r);padding:26px}
.hp-form label{display:block;font-size:13px;color:var(--hp-muted);margin-bottom:6px}
.hp-form input,.hp-form select,.hp-form textarea{border-radius:min(var(--hp-r),10px);background:#fff}
.hp-foot{background:var(--hp-night);color:rgba(255,255,255,.7);padding:40px 0;font-size:13px;line-height:2}
.hp-foot b{color:#fff;font-size:17px;display:block;font-family:var(--hp-display);font-weight:700}
.hp-foot .w{color:var(--hp-acc)}
.hp-sw{position:fixed;left:12px;bottom:14px;z-index:140;background:#111;color:#fff;border-radius:999px;padding:5px 6px 5px 14px;display:flex;align-items:center;gap:3px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hp-sw span{margin-right:4px;opacity:.75}
.hp-sw button{width:30px;height:30px;border-radius:50%;border:0;background:none;color:#fff;font-weight:700;font-size:12.5px}
.hp-sw button.on{background:#fff;color:#111}
.hp.vC .hp-sw{left:264px}
@media(max-width:900px){.hp.vC .hp-sw{left:12px}}
@media(max-width:900px){
  .hA-in{grid-template-columns:1fr;padding-top:56px;padding-bottom:70px}
  .tiles,.courses,.cidx{grid-template-columns:repeat(2,1fr)}
  .hp-two,.steps3{grid-template-columns:1fr}
  .hp-nav{display:none}
  .hp.vB .hp-login{margin-left:auto}
  .hp.vA .hp-login{margin-left:auto}
  .hp.vC{padding-left:0}
  .hp.vC .hp-wrap{padding:0 18px}
  .cside{position:sticky;top:var(--bar-h);width:auto;flex-direction:row;align-items:center;padding:12px 16px;bottom:auto}
  .cside .bar,.cside .en,.cside .ft{display:none}
  .cside .nm{font-size:20px}
  .cside .nv{display:flex;margin:0 0 0 auto;overflow-x:auto}
  .cside .nv button{font-size:13px;padding:6px 8px;white-space:nowrap}
  .hC{grid-template-columns:1fr}.hC .tx{padding:40px 0}.hC .im{min-height:200px}
}
@media(max-width:560px){.tiles,.courses{grid-template-columns:1fr}.cidx{grid-template-columns:1fr 1fr}.cidx b{font-size:20px}.cside .nv{display:none}}
/* ===== 시연 조작 바 (화면 선택) ===== */
.dm-help{border:0;background:var(--gold);color:var(--on-gold);font-weight:700;padding:5px 12px;border-radius:7px;font-size:12px;flex-shrink:0}

const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const TODAYDOW=DAYS[new Date().getDay()];

    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);let i=0;el.textContent=orig.replace(/\d+/g,m=>String(Math.round(+nums[i++]*e)));if(k<1)requestAnimationFrame(step);else el.textContent=orig;};
    requestAnimationFrame(step);
  });
}

/* ----- 선생님 ----- */
function todoItems(){
  const t=selT(),cs=tCls(),items=[];
  todayClasses().filter(c=>c.tid===t.id).forEach(c=>{
    if(st.homework.some(h=>h.cid===c.id&&h.date===TODAY))items.push({txt:`✅ ${c.name} 오늘 숙제 입력 완료`,go:'thomework'});
    else items.push({txt:`🔴 ${c.name} 오늘 숙제 미입력`,go:'thomework'});
  });
  const ss=act().filter(s=>cs.some(c=>c.id===s.cid));
  const wk=ss.filter(s=>!st.reports.some(r=>r.sid===s.id&&r.type==='주간성취도'&&r.date>=addDays(-6)));
  if(wk.length)items.push({txt:`📝 주간성취도 미작성 ${wk.length}명 · 금요일 마감 (${wk.map(s=>s.name).join(', ')})`,go:'treport'});
  const mo=ss.filter(s=>!st.reports.some(r=>r.sid===s.id&&r.type==='월말보고서'&&r.date>=addDays(-30)));
  if(mo.length)items.push({txt:`📄 월말보고서 미작성 ${mo.length}명 · 다음 달 3일 마감`,go:'treport'});
  const cm=st.reports.filter(r=>r.tid===t.id&&r.comments.length&&r.comments[r.comments.length-1].by==='학부모');
  if(cm.length)items.push({txt:`💬 학부모 댓글 답글 필요 ${cm.length}건`,go:'treport'});
  return items;
}

let PL=null;
function plUpdate(){
  if(!PL||PL.real||!$('#plTime'))return;
  const p=st.progress[PL.key]||{max:0,done:false},w=p.done?100:p.max/PL.dur*100;
  $('#plW').style.width=w+'%';$('#plC').style.width=(PL.cur/PL.dur*100)+'%';
  $('#plTime').textContent=`${fmtT(PL.cur)} / ${fmtT(PL.dur)}`;
  $('#plBig').textContent=PL.playing?'❚❚':'▶';$('#plBtn').textContent=PL.playing?'일시정지':'재생';
  $('#plInfo').textContent=p.done?'시청 완료 · 자유롭게 이동 가능':`시청 ${Math.round(w)}% · 안 본 구간으로는 못 넘겨요`;
}
function plTick(){
  if(!PL)return;
  PL.cur=Math.min(PL.dur,PL.cur+3);
  const p=st.progress[PL.key]||(st.progress[PL.key]={max:0,done:false});
  if(PL.cur>p.max)p.max=PL.cur;
  if(PL.cur>=PL.dur){p.done=true;plStop();toast('시청 완료! 관리부·선생님 시청 현황에 바로 반영됐어요');save()}
  plUpdate();
}
function plStop(){if(PL&&PL.timer){clearInterval(PL.timer);PL.timer=null}if(PL)PL.playing=false}
function plSeek(t){
  const p=st.progress[PL.key]||{max:0,done:false};
  if(!p.done&&t>p.max+1){toast('아직 안 본 구간으로는 넘길 수 없어요');return}
  PL.cur=Math.max(0,Math.min(PL.dur,Math.round(t)));plUpdate();
}

    pl.on('ended',()=>{done=true;st.progress[key]={max:Math.round(PL&&PL.dur?PL.dur:maxT),done:true,dur:Math.round(PL?PL.dur:0)};save();upd();toast('시청 완료! 선생님 시청 현황에 바로 반영돼요')});

}

async function adminSetPw(uid,newPw){

}

        const s={id:nid('s'),name:u.want==='parent'?(u.child||u.name):u.name,grade:u.grade||'',school:u.school||'',cid:cid.value,phone:u.want==='student'?(u.phone||''):'',pphone:u.want==='parent'?(u.phone||''):'',parentApp:false,kakao:true,code:newCode(),active:true,ts:Date.now()};
        st.students.push(s);save();sid=s.id}
      else{const s=st.students.find(x=>x.id===sid);if(s&&u.phone){if(u.want==='parent'&&!s.pphone)s.pphone=u.phone;if(u.want==='student'&&!s.phone)s.phone=u.phone;save()}}
      await DB.collection('users').doc(v).update({role:u.want,sid,status:'ok',approved:Date.now()});toast(`${u.name} 승인 · ${stu(sid).name} 학생과 연결했어요`)}
    catch(e){console.error(e);toast('승인하지 못했어요')}},
  async reject2(v){const u=(st.users||[]).find(x=>x.id===v);if(!u||!confirm(u.name+' 가입 신청을 거절할까요?'))return;try{await DB.collection('users').doc(v).update({status:'rejected',active:false});if(u.phone)await DB.collection('phones').doc(u.phone.replace(/[^0-9]/g,'')).delete().catch(()=>{});toast('거절했어요')}catch(e){toast('처리하지 못했어요')}},
});
Object.assign(SUB,{
  async signup(f,fd){const id=String(fd.id||'').trim().toLowerCase();if(!/^[a-z0-9._-]{3,30}$/.test(id)){toast('아이디는 영문 · 숫자 3자 이상이에요');return}
    if(String(fd.pw).length<4){toast('비밀번호는 4자 이상이에요');return}if(fd.pw!==fd.pw2){toast('두 비밀번호가 달라요');return}
    const b=f.querySelector('button.btn');b.disabled=true;
    try{await AUTH.createUserWithEmailAndPassword(idEmail(id),PWX(fd.pw));PEND_LOGIN_ID=id}
    catch(e){b.disabled=false;toast(e.code==='auth/email-already-in-use'?'이미 있는 아이디예요':'가입하지 못했어요')}},
  async profile(f,fd){
    if(!VERIFIED_PH){toast('휴대폰 인증을 먼저 마쳐 주세요');return}
    const b=f.querySelector('button.btn:not(.line)');b.disabled=true;
    try{const u=AUTH.currentUser;const prov=(u.providerData||[]).map(p=>p.providerId).filter(p=>p!=='phone')[0]||(u.uid.startsWith('kakao:')?'kakao':u.uid.startsWith('naver:')?'naver':'');
      const sn=fd.name.trim();const doc={role:'pending',status:'pending',want:fd.want,name:fd.want==='parent'?sn+' 학부모':sn,child:sn,school:fd.school.trim(),grade:fd.grade,phone:normPhone(fd.phone),phoneOk:true,via:prov==='password'?'아이디':prov==='google.com'?'구글':prov,loginId:PEND_LOGIN_ID||(u.email&&u.email.endsWith('@'+ID_DOMAIN)?u.email.split('@')[0]:''),active:true,created:Date.now()};
      await DB.collection('users').doc(u.uid).set(doc);ME={uid:u.uid,...doc};$('#modal').innerHTML='';render();pendingModal()}
    catch(e){console.error(e);b.disabled=false;toast('가입 신청을 저장하지 못했어요')}},
});
let PEND_LOGIN_ID='';
function pendingSection(){const ps=(st.users||[]).filter(u=>u.role==='pending'&&u.status==='pending');if(!ps.length)return '';
  const ss=act();
  return `<div class="card" style="border:2px solid var(--gold,#6fd3a8)"><h3>가입 승인 대기 <span class="pill warn">${ps.length}명</span></h3>
  <div class="tw"><table><tr><th>구분</th><th>이름</th><th>학생(자녀)</th><th>학교 · 학년</th><th>휴대폰</th><th>가입</th><th>연결할 학생</th><th></th></tr>${ps.map(u=>{const target=u.want==='parent'?u.child:u.name;const guess=ss.find(s=>s.name===target&&(!u.school||!s.school||s.school===u.school));
  return `<tr><td>${u.want==='parent'?'학부모':'학생'}</td><td><b>${esc(u.name)}</b></td><td>${esc(u.want==='parent'?u.child:u.name)}</td><td>${esc(u.school||'')} ${esc(u.grade||'')}</td><td>${esc(u.phone||'')}</td><td>${esc(u.via||'')}</td>
   <td><select id="ap-${u.id}" onchange="document.getElementById('apc-${u.id}').style.display=this.value==='new'?'':'none'"><option value="">선택</option>${ss.map(s=>`<option value="${s.id}" ${guess&&guess.id===s.id?'selected':''}>${esc(s.name)} (${esc(s.school||'')} ${esc(s.grade)})</option>`).join('')}<option value="new">+ 새 학생으로 등록</option></select>
   <select id="apc-${u.id}" style="display:none;margin-top:4px">${st.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></td>
   <td style="white-space:nowrap"><button class="btn sm" data-act="approve2" data-v="${u.id}">승인</button> <button class="btn sm line" data-act="reject2" data-v="${u.id}">거절</button></td></tr>`}).join('')}</table></div></div>`}

setTimeout(snsReturn,300);
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset.v,el,e)});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.chg;if(!k)return;
  if(k==='sel'){st.sel[el.dataset.k]=el.value;render();if(el.dataset.k==='student')onEnterRole('student')}
  else if(k==='branch'){st.branch=el.value;render()}
  else if(k==='showleft'){st.showLeft=el.checked;render()}
  else if(k==='xlfile'){const file=el.files&&el.files[0];el.value='';if(!file)return;(async()=>{try{await loadXLSX()}catch(e){toast('엑셀 도구를 불러오지 못했어요');return}const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).map(r=>{const o={};for(const k in r)o[String(k).replace(/\s+/g,' ').trim()]=r[k];return o});if(!rows.length||!('이름' in rows[0])){toast('첫 줄에 「이름」 제목이 있어야 해요 · 양식을 내려받아 써 주세요');return}if(!confirm(rows.length+'명을 등록하고 계정을 만들까요?'))return;importRows(rows)})();return}
  else if(k==='ctid'){const c=cls(el.dataset.id);c.tid=el.value;render();toast('담당 선생님을 바꿨어요')}
  else if(k==='scls'){stu(el.dataset.id).cid=el.value;render();toast('반이 바뀌었어요 · 영상 권한과 출결 반도 함께 바뀌어요')}
  else if(k==='vperm'){const v=st.videos.find(x=>x.id===el.dataset.id),c=el.dataset.c;v.classIds=el.checked?[...v.classIds,c]:v.classIds.filter(x=>x!==c);save();toast(el.checked?`${cls(c).name} 학생들에게 영상이 열렸어요`:`${cls(c).name} 학생들에게서 영상이 숨겨졌어요`)}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,h=SUB[f.dataset.form];if(!h)return;const fd={};new FormData(f).forEach((v,k)=>fd[k]=v);h(f,fd)});

render();
</script>
